# ---------------------------------------------------------------------------
# Protect the bot-owned ClinAnx mirror branch.
#
# The rolling branch sync/tcwpn-clinical-app is rebuilt from the latest main
# by dulhara79/tcwpn_mobile_app after an approved source-main change.
# Human commits on this branch must be moved to the source repository instead.
# ---------------------------------------------------------------------------
name: repo-sync-branch-guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  guard:
    name: Protect ClinAnx sync branch
    if: github.head_ref == 'sync/tcwpn-clinical-app'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify bot authorship and change scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          EXPECTED_EMAIL: tcwpn-sync@users.noreply.github.com
          OWNED_PREFIX: apps/tcwpn-clinical-app/
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin "${{ github.base_ref }}" --depth=100

          foreign="$(
            git log --format='%H%x09%ae%x09%s'               "origin/${{ github.base_ref }}..HEAD"             | awk -F '\t' -v expected="${EXPECTED_EMAIL}" '$2 != expected { print }'
          )"

          if [[ -n "${foreign}" ]]; then
            echo "${foreign}"
            gh pr comment "${PR}" --body "Manual commits were detected on the bot-owned \`sync/tcwpn-clinical-app\` branch. Make clinician-app changes in \`dulhara79/tcwpn_mobile_app\`, merge them to source \`main\`, and let the mirror workflow update this PR."
            echo "::error::Unexpected non-bot commits detected on the ClinAnx sync branch."
            exit 1
          fi

          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          outside="$(printf '%s\n' "${changed}" | grep -v "^\${OWNED_PREFIX}" || true)"

          if [[ -n "${outside}" ]]; then
            echo "${outside}"
            echo "::error::ClinAnx mirror PR modifies files outside ${OWNED_PREFIX}."
            exit 1
          fi

          echo "OK — bot authorship and ClinAnx mirror scope are valid."
