name: Physiological feature contract
on:
  pull_request:
    paths:
      - 'Self-supervised Physiological Biosensors/Aura-Biomonitor/ChestStrap_V3/**'
      - '.github/workflows/physiological-feature-contract.yml'
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check minute statistics and gravity removal
        working-directory: Self-supervised Physiological Biosensors/Aura-Biomonitor/ChestStrap_V3
        run: |
          g++ -std=c++11 -O2 -Wall -Wextra -Werror tests/model_minute_test.cpp -o /tmp/model-minute-test
          /tmp/model-minute-test
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2
        with:
          version: '1.3.1'
      - name: Install ESP32-C3 toolchain and existing sensor libraries
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.2 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install 'OneWire@2.3.8' 'DallasTemperature@4.0.5'
      - name: Compile complete ESP32-C3 firmware
        run: arduino-cli compile --fqbn esp32:esp32:esp32c3 --output-dir build/cheststrap 'Self-supervised Physiological Biosensors/Aura-Biomonitor/ChestStrap_V3'
