# ---------------------------------------------------------------------------
# Monorepo-side validation for Component 4 (TC-WPN).
#
# Path-filtered so a PR touching only the biosensor or graph component never
# burns minutes here. Add a sibling workflow per component with the same shape.
#
# Naming convention for monorepo workflows:
#   component-<slug>-ci.yml   per-component CI
#   repo-<concern>.yml        repository-wide concerns
# ---------------------------------------------------------------------------
name: component-tcwpn-ci

on:
  pull_request:
    paths:
      - "Anxiety_Detection_TC_WPN/**"
      - ".github/workflows/component-tcwpn-ci.yml"
  push:
    branches: [main]
    paths:
      - "Anxiety_Detection_TC_WPN/**"

concurrency:
  group: component-tcwpn-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    working-directory: Anxiety_Detection_TC_WPN/research-pipeline

jobs:
  validate:
    name: Validate TC-WPN mirror
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Anxiety_Detection_TC_WPN/research-pipeline/requirements.txt

      # -----------------------------------------------------------------
      # Provenance. Every mirrored tree carries .sync-metadata.json. If it
      # is missing, someone hand-edited the component folder instead of
      # going through tcwpn_test — which is exactly how the two repos drift.
      # -----------------------------------------------------------------
      - name: Verify provenance manifest
        run: |
          set -euo pipefail
          if [ ! -f .sync-metadata.json ]; then
            echo "::error::.sync-metadata.json is missing. This directory is"
            echo "::error::owned by the tcwpn_test mirror. Do not edit it directly."
            exit 1
          fi
          python -c "import json;d=json.load(open('.sync-metadata.json'));print('source commit:',d['source_commit']);print('synced at:',d['synced_at_utc'])"

      - name: Install
        run: |
          python -m pip install --upgrade pip ruff==0.6.9
          pip install --index-url https://download.pytorch.org/whl/cpu torch || true
          pip install -r requirements.txt
          pip install pytest

      - name: Lint
        run: ruff check src tests

      - name: Tests
        env:
          TCWPN_ENV: ci
          TOKENIZERS_PARALLELISM: "false"
        run: pytest tests -m "not slow and not requires_data" -q

  # -------------------------------------------------------------------------
  # Cross-component blast-radius check. A component PR must not modify another
  # component's directory. Catches a misconfigured mirror before it lands.
  # -------------------------------------------------------------------------
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Assert changes stay inside the component
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$CHANGED"

          OTHER=$(echo "$CHANGED" | grep -E '^(C3_Personalised_Anxiety_Intervention_Framework|Self-supervised Physiological Biosensors|graph-behavioral-phenotyping)/' || true)
          if [ -n "$OTHER" ]; then
            echo "::error::This PR modifies another component's directory:"
            echo "$OTHER"
            exit 1
          fi