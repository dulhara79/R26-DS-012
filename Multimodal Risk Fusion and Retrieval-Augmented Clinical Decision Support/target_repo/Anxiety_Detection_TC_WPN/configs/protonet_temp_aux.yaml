name: protonet_temp_aux
description: >
  ALIAS of aux_only, provided so the config name matches the supervisor's ablation table. Running this re-trains an identical model; the existing aux_only_k5_seed42 run is the same configuration and should be relabelled rather than re-run.
model:
  preset: aux_only
  encoder_name: emilyalsentzer/Bio_ClinicalBERT
  projection_dim: 256
  freeze_bert: false
  init_temperature: 10.0
  init_lambda: 0.5
  init_beta: 2.0
  consistency_passes: 1
optim:
  encoder_lr: 2.0e-5
  head_lr: 1.0e-3
  weight_decay: 0.01
  warmup_frac: 0.1
  grad_accum: 1
  grad_clip: 1.0
  amp: true
  eval_every: 250
  val_episodes: 60
threshold_objective: f1
